name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tipos
        run: mypy src
      - name: Pruebas
        run: pytest

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U office" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OFFICE_TEST_DATABASE_URL: postgresql+psycopg://office:office@localhost:5432/office_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev,postgres]"
      - name: Pruebas contra PostgreSQL
        run: pytest --no-cov tests/test_api_core.py tests/test_tasks_and_execution.py tests/test_security_and_approvals.py
